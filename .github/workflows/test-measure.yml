name: Test and Measure

on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint-php:
    name: Lint PHP
    uses: rtCamp/wp-shared-workflows/.github/workflows/ci-lint-php.yml@6a4d945cc07377a6ce02ae4831a9817fe629d5b1 # v1.1.1
    with:
      php-version: '8.2'
      enable-phpstan: true
      phpstan-command: composer analyse

  lint-js:
    name: Lint JS and check formatting
    uses: rtCamp/wp-shared-workflows/.github/workflows/ci-lint-js.yml@6a4d945cc07377a6ce02ae4831a9817fe629d5b1 # v1.1.1
    with:
      lint-command: >-
        status=0;
        npm run lint:js || status=1;
        npm run format:check || status=1;
        exit $status

  unit-test-php:
    name: 'PHP ${{ matrix.php }} / WP ${{ matrix.wp }}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        wp: ['6.5', '6.6', '6.7', '6.8', '6.9', '7.0', '7.1']
        exclude:
          # WordPress added PHP 8.4 support in 6.7.
          - { php: '8.4', wp: '6.5' }
          - { php: '8.4', wp: '6.6' }
        include:
          # Only collect coverage on the latest PHP/WP combination.
          - { php: '8.4', wp: '7.1', coverage: true }
    env:
      WP_ENV_PHP_VERSION: ${{ matrix.php }}
      WP_ENV_CORE: WordPress/WordPress#${{ matrix.wp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci
        env:
          CI: true

      - name: Start WP environment
        run: npm run wp-env start ${{ matrix.coverage && '-- --xdebug=coverage' || '' }}

      - name: Run tests
        run: npm run test:php

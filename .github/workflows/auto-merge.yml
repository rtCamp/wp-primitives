name: Dependabot auto-merge

# GitHub's documented pattern: run on the Dependabot pull request itself (no
# workflow_run, no checkout), read the update type from Dependabot's metadata and
# enable auto-merge for minor and patch updates. Auto-merge then waits for every
# ruleset requirement, so the "Test and Measure" jobs must be required status
# checks for a red run to block the merge.
#
# Repository prerequisites (Settings): "Allow auto-merge" enabled, and the main
# ruleset's required reviews satisfiable for Dependabot pull requests.

on: pull_request

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  dependabot:
    name: Dependabot PR auto-merge
    runs-on: ubuntu-latest
    # The pull request author cannot be spoofed, unlike github.actor.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for minor and patch updates
        if: >-
          steps.metadata.outputs.update-type == 'version-update:semver-minor' ||
          steps.metadata.outputs.update-type == 'version-update:semver-patch'
        run: gh pr merge --auto --merge "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
